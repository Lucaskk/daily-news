<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>股票分析準備中</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
    main { width: min(560px, calc(100% - 32px)); padding: 28px; background: white; border: 1px solid #dce3ec; border-radius: 8px; box-shadow: 0 8px 28px rgba(22, 32, 51, .08); }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { line-height: 1.65; color: #536177; }
    .code { font: 700 32px ui-monospace, SFMono-Regular, Menlo, monospace; color: #1d4ed8; margin: 18px 0 6px; }
    .status { padding: 12px 14px; border-left: 4px solid #d97706; background: #fff8eb; color: #7c4a03; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>股票分析準備中</h1>
    <div id="code" class="code">----</div>
    <p id="name"></p>
    <p id="status" class="status">正在確認最新分析頁，通常會在 1 到 3 分鐘內完成。</p>
    <p>可保留此頁，完成後會自動前往分析結果。僅供研究參考，不構成投資建議。</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code") || "";
    const name = params.get("name") || "";
    const requestedAt = Date.parse(params.get("requested_at") || "");
    const codeNode = document.getElementById("code");
    const nameNode = document.getElementById("name");
    const statusNode = document.getElementById("status");
    let checkTimer = null;
    let checking = false;
    codeNode.textContent = /^\d{4}$/.test(code) ? code : "代碼錯誤";
    nameNode.textContent = name ? name : "";

    function taipeiDatePath() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
      const date = `${values.year}-${values.month}-${values.day}`;
      return {
        date,
        directory: `${values.year}/${values.month}/${date}/${code}`,
      };
    }

    async function check() {
      if (checking) return;
      if (!/^\d{4}$/.test(code)) {
        statusNode.textContent = "請回到 LINE，重新輸入 4 位數台股代碼。";
        return;
      }
      checking = true;
      const { date, directory } = taipeiDatePath();
      const jsonTarget = `${directory}/stock-analysis-${code}-${date}.json`;
      const htmlTarget = `${directory}/stock-analysis-${code}-${date}.html`;
      try {
        const response = await fetch(`${jsonTarget}?t=${Date.now()}`, { cache: "no-store" });
        if (response.ok) {
          const analysis = await response.json();
          const fetchedAt = Date.parse(analysis.metadata?.fetched_at || "");
          if (!Number.isFinite(requestedAt) || (Number.isFinite(fetchedAt) && fetchedAt >= requestedAt)) {
            location.replace(`${htmlTarget}?t=${Date.now()}`);
            return;
          }
          statusNode.textContent = "已收到查詢，正在等待這次的最新分析完成。";
        }
      } catch (error) {
        statusNode.textContent = "目前無法連線，稍後會自動重試。";
      } finally {
        checking = false;
      }
      checkTimer = setTimeout(check, 5000);
    }

    window.addEventListener("pageshow", check);
    window.addEventListener("focus", check);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        clearTimeout(checkTimer);
        check();
      }
    });
    check();
  </script>
</body>
</html>

    const groups = [
      {title:'Top 1–2｜政權交接與中東履約', idx:[0,1], bg:2, cls:''},
      {title:'Top 3–4｜戰爭外溢與西歐熱浪', idx:[2,3], bg:3, cls:''},
      {title:'Top 5–7｜司法、公共衛生與媒體獨立', idx:[4,5,6], bg:4, cls:'light'},
      {title:'Top 8–10｜市場提案、住房法案與央行遺產', idx:[7,8,9], bg:5, cls:'light'}
    ];
    groups.forEach(g => slide(g.cls, g.bg, '<h2>' + esc(g.title) + '</h2><div class="grid ' + (g.idx.length === 3 ? 'three' : '') + '">' + g.idx.map(i => detailsCard(data.global[i], String(data.global[i].n))).join('') + '</div>'));
    slide('', 6, '<h2>科技／AI 產品與平台新聞</h2><p class="meta">今日科技主軸不是單一大型模型，而是 agent 權限、語音助理本地化、客廳平台、AI compute、legaltech、監控、演算法定價、資安供應鏈與 messaging 商業化。</p><div class="grid three">' + data.tech.map(x => detailsCard(x, 'T' + x.n)).join('') + '</div>');
    slide('light', 7, '<h2>綜合判讀與後續追蹤</h2><div class="grid">' + data.synthesis.map(simpleDetails).join('') + data.followups.map(simpleDetails).join('') + '</div>');
    const sourceCards = data.backgrounds.map((b, i) => '<div class="card"><strong>背景圖 ' + (i+1) + '｜' + esc(b.name) + '</strong><br>' + esc(b.credit) + '<br><a href="' + esc(b.url) + '">' + esc(b.url) + '</a></div>').join('');
    const newsSources = data.global.concat(data.tech).map(item => item.sources.map(s => '<div class="card"><strong>' + esc(item.headline) + '</strong><br>' + esc(s.label) + '<br><a href="' + esc(s.url) + '">' + esc(s.url) + '</a></div>').join('')).join('');
    slide('', 8, '<h2>來源與圖片授權</h2><p class="meta">每張新聞與科技卡片的展開區塊底部均保留可讀來源標籤與完整 URL；此頁另列背景圖來源。</p><div class="source-list">' + sourceCards + newsSources + '</div>');
    const slides = Array.from(document.querySelectorAll('.slide'));
    let current = 0;
    function show(i){
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides.forEach((s, idx) => s.classList.toggle('active', idx === current));
      document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
    }
    document.getElementById('prev').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    window.addEventListener('keydown', (e) => {
      if (e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(current + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(current - 1); }
      if (e.key === 'Home') show(0);
      if (e.key === 'End') show(slides.length - 1);
    });
    show(0);
  </script>
</body>
</html>
